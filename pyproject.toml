# ===========================================
# Fast_Swarm - Code Quality Configuration
# ===========================================

[project]
name = "Fast_Swarm"
version = "0.1.0"
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ===========================================
# RUFF Configuration
# ===========================================
[tool.ruff]
target-version = "py312"
line-length = 120

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "tmpclaude-*",
    ".hypothesis",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

# Ignore these specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in FastAPI)
    "B904",   # raise without from (too noisy)
    "SIM108", # ternary operator (readability preference)
    # Legacy code / style preferences (non-bugs)
    "RUF013", # implicit-optional - pedantic typing
    "E402",   # module-import-not-at-top - often intentional for path setup
    "RUF059", # unused-unpacked-variable - legacy code
    "F841",   # unused-variable - often intentional (side effects)
    "RUF012", # mutable-class-default - SQLModel/Pydantic pattern
    "RUF002", # ambiguous-unicode-docstring - harmless in comments
    "RUF003", # ambiguous-unicode-comment - harmless in comments
    "E731",   # lambda-assignment - style preference
    "SIM102", # collapsible-if - readability subjective
    "SIM103", # needless-bool - readability subjective
    "B007",   # unused-loop-control-variable - often intentional
    "PTH123", # builtin-open - legacy code
    "PTH120", # os-path-dirname - legacy code
    "PTH118", # os-path-join - legacy code
    "PTH110", # os-path-exists - legacy code
    "PTH109", # os-getcwd - legacy code
    "PTH100", # os-path-abspath - legacy code
    "PTH202", # os-path-getsize - legacy code
    "RUF006", # asyncio-dangling-task - fire-and-forget tasks, fix later
    "E712",   # true-false-comparison - required for SQLAlchemy queries
    "RUF022", # unsorted-dunder-all - style preference
    "E741",   # ambiguous-variable-name - l for low in OHLCV is standard
    "SIM105", # suppressible-exception - explicit try/except sometimes clearer
    # Style preferences - ignore
    "RUF034", # useless-if-else
    "RUF001", # ambiguous-unicode-character-string
    "RUF046", # unnecessary-cast-to-int
    "RUF005", # collection-literal-concatenation
    "SIM118", # in-dict-keys
    "SIM116", # if-else-block-instead-of-dict-lookup
    "SIM117", # multiple-with-statements
    "SIM201", # negate-equal-op
    "C414",   # unnecessary-double-cast-or-process
    "TC001",  # typing-only-first-party-import
    "TC002",  # typing-only-third-party-import
    "UP007",  # non-pep604-annotation-union
    "UP045",  # non-pep604-annotation-optional
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed rules
"Tests/**/*.py" = ["B011", "SIM"]
"**/test_*.py" = ["B011", "SIM"]
# __init__.py files re-export symbols intentionally
"**/__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ===========================================
# PYRIGHT Configuration
# ===========================================
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"

# Type checking mode: off, basic, standard, strict, all
typeCheckingMode = "basic"  # Start with basic, upgrade to strict later

# Include/exclude
include = ["."]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "tmpclaude-*",
    ".hypothesis",
    "local_agents",  # Legacy code, exclude initially
]

# Report settings (for basic mode)
reportMissingImports = true
reportMissingTypeStubs = false  # Don't require stubs for all packages
reportUnusedImport = true
reportUnusedVariable = true

# ===========================================
# BANDIT Configuration
# ===========================================
[tool.bandit]
exclude_dirs = [".git", "venv", ".venv", "tmpclaude-*", ".hypothesis", "Tests"]
skips = [
    "B101",  # assert_used - we use assert in tests
    "B104",  # hardcoded_bind_all_interfaces - dev server binds 0.0.0.0
    "B303",  # md5 - used for cache keys, not security (usedforsecurity=False equivalent)
    "B310",  # urllib_urlopen - internal health checks to vLLM/Ollama, not user URLs
    "B311",  # random - we intentionally use random for chaos/evolution
    "B608",  # sql_injection - false positives on SQLAlchemy ORM parameterized queries
]

# ===========================================
# PYTEST Configuration (bonus)
# ===========================================
[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
