# ===========================================
# Fast_Swarm - Code Quality Configuration
# ===========================================

[project]
name = "Fast_Swarm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "quantstats>=0.0.62",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ===========================================
# RUFF Configuration
# ===========================================
[tool.ruff]
target-version = "py312"
line-length = 120

# Exclude directories
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "tmpclaude-*",
    ".hypothesis",
]

[tool.ruff.lint]
# Enable these rule sets
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "RUF",    # Ruff-specific rules
]

# Ignore these specific rules
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (common in FastAPI)
    "B904",   # raise without from (too noisy)
    "SIM108", # ternary operator (readability preference)
]

# Allow autofix for all enabled rules
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
# Tests can have more relaxed rules
"Tests/**/*.py" = ["B011", "SIM"]
"**/test_*.py" = ["B011", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# ===========================================
# PYRIGHT Configuration
# ===========================================
[tool.pyright]
pythonVersion = "3.12"
pythonPlatform = "All"

# Type checking mode: off, basic, standard, strict, all
typeCheckingMode = "basic"  # Start with basic, upgrade to strict later

# Include/exclude
include = ["."]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "tmpclaude-*",
    ".hypothesis",
    "local_agents",  # Legacy code, exclude initially
]

# Report settings (for basic mode)
reportMissingImports = true
reportMissingTypeStubs = false  # Don't require stubs for all packages
reportUnusedImport = true
reportUnusedVariable = true

# ===========================================
# BANDIT Configuration
# ===========================================
[tool.bandit]
exclude_dirs = [".git", "venv", ".venv", "tmpclaude-*", ".hypothesis", "Tests"]
skips = [
    "B101",  # assert_used - we use assert in tests
    "B104",  # hardcoded_bind_all_interfaces - dev server binds 0.0.0.0
    "B311",  # random - we intentionally use random for chaos/evolution
]

# ===========================================
# PYTEST Configuration (bonus)
# ===========================================
[tool.pytest.ini_options]
testpaths = ["Tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
