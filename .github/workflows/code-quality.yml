name: Code Quality

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ============================================
  # RUFF - Fast linter (700+ rules, auto-fixes)
  # ============================================
  ruff:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install ruff
      run: pip install ruff

    - name: Ruff check
      run: ruff check . --output-format=github

    - name: Ruff format check
      run: ruff format --check .

  # ============================================
  # PYRIGHT - Strict type checking
  # ============================================
  pyright:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-pyright-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install pyright
        # Install project deps for type stubs (if requirements.txt exists)
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Pyright
      run: pyright --outputjson | head -100 || true
      # Note: Using '|| true' initially since strict typing may have many errors
      # Remove '|| true' once codebase is type-clean

  # ============================================
  # BANDIT - Security vulnerability scanner
  # ============================================
  bandit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install bandit
      run: pip install "bandit[toml]>=1.7.8"

    - name: Bandit security scan (blocking - high severity only)
      run: |
        bandit -r . \
          -c pyproject.toml \
          --severity-level high \
          --confidence-level high \
          -f txt

    - name: Bandit security scan (warnings - medium severity)
      if: always()
      run: |
        echo "::notice::The following are security warnings (non-blocking):"
        bandit -r . \
          -c pyproject.toml \
          --severity-level medium \
          --confidence-level medium \
          -f txt || true
