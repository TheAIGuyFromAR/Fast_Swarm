version: '3.8'

# Fast_Swarm PostgreSQL Database
# Auto-started by Docker.py when Fast_Swarm boots

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: coinswarm-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: coinswarm
      POSTGRES_PASSWORD: coinswarm_dev_2024
      POSTGRES_DB: coinswarm
    volumes:
      - G:/docker-data/postgres:/var/lib/postgresql/data
    # Increase shared memory for large UPDATE operations (default 64MB is too small)
    shm_size: 2g
    # Tuned for 128GB RAM system with high concurrency
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=8GB"
      - "-c"
      - "effective_cache_size=24GB"
      - "-c"
      - "work_mem=256MB"
      - "-c"
      - "maintenance_work_mem=2GB"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "max_locks_per_transaction=256"
      - "-c"
      - "max_parallel_workers_per_gather=4"
      - "-c"
      - "max_parallel_workers=8"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coinswarm"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 32G

volumes:
  coinswarm_pgdata:
    driver: local
